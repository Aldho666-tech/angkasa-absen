<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Login - Kp Rute</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="logo-container">
      <img src="css/asset/LOGO.png" alt="Logo Kp Rute" class="logo-glow" 
           onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
      <div class="logo-placeholder" style="display: none;">
      </div>
    </div>

    <div class="login-card">
      <div class="welcome-section">
        <h2>Selamat Datang!</h2>
        <p>Semangat kerjanya, yuk budayakan absen tepat waktu!</p>
      </div>

      <form class="form-section" onsubmit="handleLogin(event)">
        <div class="input-group">
          <label for="username">Username</label>
          <div class="input-wrapper">
            <input 
              type="text" 
              id="username" 
              name="username"
              placeholder="Masukkan username Anda"
              required
              autocomplete="username"
            >
          </div>
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <input 
              type="password" 
              id="password" 
              name="password"
              placeholder="Masukkan password Anda"
              required
              autocomplete="current-password"
            >
          </div>
        </div>

        <button type="submit" class="login-button" id="loginButton">
          <div class="button-content">
            <span id="buttonText">LOGIN</span>
            <div id="loadingSpinner" class="spinner" style="display: none;"></div>
          </div>
        </button>

        <div class="demo-accounts" style="margin-top: 20px; padding: 12px; background: rgba(255,255,255,0.06); border-radius: 8px; border: 1px dashed rgba(255,255,255,0.2); font-size: 13px; text-align: center;">
          <p style="margin: 0 0 8px 0; color: #a0aec0; font-weight: 500;">Akun Demo Cepat (Klik untuk Isi):</p>
          <div style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;">
            <button type="button" onclick="quickLogin('adminaldo@gmail.com', 'admin123')" style="background: #e53e3e; color: white; border: none; border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 12px; font-weight: 600;">👑 Admin</button>
            <button type="button" onclick="quickLogin('jaka@gmail.com', 'jaka123')" style="background: #3182ce; color: white; border: none; border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 12px; font-weight: 600;">👤 Karyawan (Jaka)</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <footer>
    <div class="footer-content">
      <p>&copy; 2025 Angkasa Express.</p>
      <p><a href="#">Kebijakan Privasi</a> | <a href="#">Syarat & Ketentuan</a></p>
    </div>
  </footer>

  <script src="js/login.js"></script>

</body>
</html>
